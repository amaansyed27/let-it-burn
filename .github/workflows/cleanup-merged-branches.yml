name: One-shot branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-shot-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'amaansyed27/let-it-burn'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete obsolete branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'agent/realistic-incinerate',
              'agent/reference-edge-flames',
              'agent/verify-production-build',
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 422) {
                  core.info(`${branch} was already deleted`);
                  continue;
                }
                throw error;
              }
            }

      - name: Remove this cleanup workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/cleanup-merged-branches.yml';
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main',
            });

            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              sha: response.data.sha,
              message: 'chore: remove one-shot cleanup workflow',
            });
